name: edusync
description: "EduSync - India-first AI Study Companion for School and College Students"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Backend & Auth
  supabase_flutter: ^2.8.0

  # State Management
  provider: ^6.1.2

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0

  # Chat & Content Rendering
  flutter_markdown: ^0.7.3
  intl: ^0.19.0
  uuid: ^4.4.0

  # Files & Persistence
  file_picker: ^8.0.5
  shared_preferences: ^2.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
